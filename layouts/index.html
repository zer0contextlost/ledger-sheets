{{ define "main" }}
<section class="intro">
  <h1>{{ .Site.Title }}</h1>
  <p>{{ .Site.Params.description }}</p>
</section>
<section class="sheet">
  <div class="sheet-head">
    <span>Sheet</span>
    <span>Updated</span>
  </div>
  {{ range (where .Site.RegularPages "Type" "posts").ByDate.Reverse }}
  <article class="post-summary">
    <a class="row-link" href="{{ .RelPermalink }}" aria-label="{{ .Title }}"></a>
    <div class="cell-main">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p class="excerpt">{{ .Description }}</p>
    </div>
    <div class="cell-meta">
      <span class="date">{{ .Date.Format "Jan 2, 2006" }}</span>
    </div>
  </article>
  {{ end }}
</section>
{{ end }}
